        <div class="set-row">
          <div class="rt"><b>Clear completed reminders</b><span>Remove finished reminders permanently from this device.</span></div>
          <div class="rc"><button class="btn btn-ghost btn-sm inline" data-act="clear-completed">${ICON.trash} Clear</button></div>
        </div>
      </section>

      <section class="set-section">
        <span class="t-label">Account &amp; sync</span>
        <div class="set-row">
          <div class="rt"><b>Local storage</b><span>Reminders are saved in this browser. The data layer is written as a swappable module so cloud sync can be added later.</span></div>
          <div class="rc"><span class="chip"><span class="dot" style="background:var(--green)"></span>On device</span></div>
        </div>
        <div class="set-row">
          <div class="rt"><b>Keyboard shortcuts</b><span><span class="mono">N</span> new reminder · <span class="mono">/</span> search · <span class="mono">A</span> assistant · <span class="mono">T</span> theme · <span class="mono">1–5</span> pages · <span class="mono">Esc</span> close</span></div>
        </div>
      </section>

      <p class="t-caption" style="padding-bottom:var(--s6)">Remindly · local build · ${store.reminders.length} reminder${store.reminders.length === 1 ? "" : "s"} stored</p>
    </div>`;

  const dur = $("#setDuration");
  if (dur) dur.addEventListener("change", e => { store.prefs.duration = Number(e.target.value); store.persist(); ui.toast("Default duration updated"); });

  const vol = $("#setVolume");
  if (vol) vol.addEventListener("input", e => {
    store.prefs.volume = Number(e.target.value);
    const l = $("#volLabel");
    if (l) l.textContent = Math.round(store.prefs.volume * 100) + "%";
    store.persist();
  });
  if (vol) vol.addEventListener("change", () => notif.chime());

  const file = $("#importFile");
  if (file) file.addEventListener("change", handleImport);
}

/* ------------------------------------------------------------- router */
const VIEW_TITLES = {
  dashboard: "Dashboard",
  reminders: "Reminders",
  calendar: "Calendar",
  completed: "Completed",
  settings: "Settings"
};
const VIEW_ORDER = ["dashboard", "reminders", "calendar", "completed", "settings"];

function render() {
  const v = store.ui.view;
  $("#pageTitle").textContent = VIEW_TITLES[v] || "Remindly";
  document.title = `Remindly — ${VIEW_TITLES[v] || ""}`;

  $$$$("#nav .nav-item, #bottomnav .bn-item").forEach(b => {
    const active = b.dataset.view === v;
    b.classList.toggle("active", active);
    if (active) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  });

  if (v === "dashboard") renderDashboard();
  else if (v === "reminders") renderReminders();
  else if (v === "calendar") renderCalendar();
  else if (v === "completed") renderCompleted();
  else renderSettings();

  updateBadge();
}

function go(next) {
  if (next === store.ui.view) return;
  const dir = VIEW_ORDER.indexOf(next) > VIEW_ORDER.indexOf(store.ui.view) ? "12px" : "-12px";
  store.ui.view = next;
  render();
  const el = view.firstElementChild;
  if (el && !reduceMotion()) {
    el.style.setProperty("--dir", dir);
  }
  window.scrollTo({ top: 0, behavior: reduceMotion() ? "auto" : "smooth" });
}

function updateBadge() {
  const n = store.reminders.filter(r => !r.completed && sched.effective(r) <= Date.now() + 3600000).length;
  const b = $("#bellBadge");
  if (!b) return;
  b.textContent = String(n);
  b.dataset.zero = n === 0 ? "1" : "0";
}

/* ------------------------------------------------------- reminder form */
function openReminderForm(existing, preset) {
  const isEdit = Boolean(existing);
  const r = existing ? { ...existing, custom: { ...(existing.custom || {}) } } : makeReminder({
    date: preset?.date || ymd(new Date()),
    time: preset?.time || defaultTime()
  });

  const html = `
    <div class="modal-head">
      <h2 id="formTitle">${isEdit ? "Edit reminder" : "New reminder"}</h2>
      <button class="icon-btn" data-close aria-label="Close">${ICON.close}</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label for="fTitle">Reminder title</label>
        <input class="input" id="fTitle" maxlength="120" placeholder="e.g. Study Maths" value="${esc(r.title === "Untitled reminder" && !isEdit ? "" : r.title)}" required>
      </div>

      <div class="field">
        <label for="fNotes">Description / notes</label>
        <textarea class="input" id="fNotes" maxlength="1000" placeholder="Add anything that helps — location, links, a short checklist.">${esc(r.notes)}</textarea>
      </div>

      <div class="form-2">
        <div class="field">
          <label for="fDate">Date</label>
          <input class="input" id="fDate" type="date" value="${r.date}" required>
        </div>
        <div class="field">
          <label for="fTime">Time</label>
          <input class="input" id="fTime" type="time" value="${r.time}" required>
        </div>
      </div>

      <div class="field">
        <label>Repeat</label>
        <div class="opt-row" id="fRepeat">
          ${[["none", "Does not repeat"], ["daily", "Daily"], ["weekly", "Weekly"], ["monthly", "Monthly"], ["custom", "Custom"]]
      .map(([k, l]) => `<button type="button" class="opt ${r.repeat === k ? "active" : ""}" data-val="${k}">${l}</button>`).join("")}
        </div>
      </div>

      <div class="form-2" id="customWrap" style="${r.repeat === "custom" ? "" : "display:none"}">
        <div class="field">
          <label for="fEvery">Every</label>
          <input class="input" id="fEvery" type="number" min="1" max="365" value="${r.custom?.every || 1}">
        </div>
        <div class="field">
          <label for="fUnit">Unit</label>
          <select class="input" id="fUnit">
            ${["days", "weeks", "months"].map(u => `<option value="${u}" ${(r.custom?.unit || "days") === u ? "selected" : ""}>${u.charAt(0).toUpperCase() + u.slice(1)}</option>`).join("")}
          </select>
        </div>
      </div>

      <div class="field">
        <label>Priority</label>
        <div class="opt-row" id="fPriority">
          ${[["low", "Low"], ["medium", "Medium"], ["high", "High"]]
      .map(([k, l]) => `<button type="button" class="opt ${r.priority === k ? "active" : ""}" data-val="${k}">${l}</button>`).join("")}
        </div>
      </div>

      <div class="field">
        <label>Category</label>
        <div class="opt-row" id="fCategory">
          ${CATS.map(c => `<button type="button" class="opt ${r.category === c ? "active" : ""}" data-val="${c}"><span class="sw" style="background:${CAT_COLOR[c]}"></span>${c}</button>`).join("")}
        </div>
      </div>

      <div class="field">
        <label>Colour marker (optional)</label>
        <div class="opt-row" id="fColor">
          ${Object.entries(CAT_COLOR).map(([name, hex]) => `
            <button type="button" class="opt ${r.color === hex ? "active" : ""}" data-val="${hex}" aria-label="${name}">
              <span class="sw" style="background:${hex};width:15px;height:15px"></span>
            </button>`).join("")}
          <button type="button" class="opt ${!r.color ? "active" : ""}" data-val="">Auto</button>
        </div>
      </div>

      <div class="set-row" style="padding-bottom:0;border-bottom:0">
        <div class="rt">
          <b>Notification</b>
          <span>Alert me when this reminder is due.</span>
        </div>
        <div class="rc">
          <button type="button" class="switch" id="fNotify" role="switch" aria-checked="${r.notify}" aria-label="Notification"></button>
        </div>
      </div>
    </div>
    <div class="modal-foot">
      ${isEdit ? `<button class="btn btn-ghost" data-act="delete-from-form">${ICON.trash} Delete</button>` : ""}
      <button class="btn btn-ghost" data-close>Cancel</button>
      <button class="btn btn-primary" data-act="save">${isEdit ? "Save changes" : "Create reminder"}</button>
    </div>`;

  ui.openModal(html, {
    wide: true,
    onMount(modal, close) {
      const state = {
        repeat: r.repeat,
        priority: r.priority,
        category: r.category,
        color: r.color || "",
        notify: r.notify
      };

      const group = (sel, key, after) => {
        const wrap = modal.querySelector(sel);
        wrap.addEventListener("click", e => {
          const b = e.target.closest(".opt");
          if (!b) return;
          wrap.querySelectorAll(".opt").forEach(x => x.classList.remove("active"));
          b.classList.add("active");
          state[key] = b.dataset.val;
          if (after) after();
        });
      };
      group("#fRepeat", "repeat", () => {
        modal.querySelector("#customWrap").style.display = state.repeat === "custom" ? "" : "none";
      });
      group("#fPriority", "priority");
      group("#fCategory", "category");
      group("#fColor", "color");

      const notifyBtn = modal.querySelector("#fNotify");
      notifyBtn.addEventListener("click", () => {
        state.notify = notifyBtn.getAttribute("aria-checked") !== "true";
        notifyBtn.setAttribute("aria-checked", String(state.notify));
      });

      modal.addEventListener("click", async e => {
        const act = e.target.closest("[data-act]")?.dataset.act;

        if (act === "delete-from-form") {
          close();
          await deleteReminder(existing.id);
          return;
        }

        if (act !== "save") return;

        const title = modal.querySelector("#fTitle").value.trim();
        const date = modal.querySelector("#fDate").value;
        const time = modal.querySelector("#fTime").value;

        if (!title) {
          modal.querySelector("#fTitle").focus();
          ui.toast("Please add a reminder title", "warn");
          return;
        }
        if (!date || Number.isNaN(parseYmd(date).getTime())) {
          modal.querySelector("#fDate").focus();
          ui.toast("Please choose a valid date", "warn");
          return;
        }
        if (!time || !/^\d{2}:\d{2}$/.test(time)) {
          modal.querySelector("#fTime").focus();
          ui.toast("Please choose a valid time", "warn");
          return;
        }

        const payload = {
          title,
          notes: modal.querySelector("#fNotes").value.trim(),
          date,
          time,
          repeat: state.repeat,
          custom: {
            every: clamp(Number(modal.querySelector("#fEvery")?.value || 1), 1, 365),
            unit: modal.querySelector("#fUnit")?.value || "days"
          },
          priority: state.priority,
          category: state.category,
          color: state.color || null,
          notify: state.notify,
          notifiedFor: null
        };

        if (isEdit) {
          await store.update(existing.id, payload);
          ui.toast("Reminder updated");
        } else {
          const nr = makeReminder(payload);
          await store.add(nr);
          ui.toast("Reminder created");
          notif.chime();
          lastCreatedId = nr.id;
        }
        close();
        render();
      });

      setTimeout(() => modal.querySelector("#fTitle")?.focus(), 40);
    }
  });
}

function defaultTime() {
  const d = new Date();
  d.setMinutes(d.getMinutes() + Number(store.prefs.duration || 30));
  return `${pad(d.getHours())}:${pad(Math.round(d.getMinutes() / 5) * 5 % 60)}`;
}

let lastCreatedId = null;

async function deleteReminder(id) {
  const r = store.get(id);
  if (!r) return;
  const ok = await ui.confirm({
    title: `Delete “${r.title}”?`,
    body: "This reminder will be removed permanently. This cannot be undone.",
    confirmLabel: "Delete reminder",
    danger: true
  });
  if (!ok) return;
  await store.remove(id);
  ui.toast("Reminder deleted", "warn");
  render();
}

async function toggleReminder(id) {
  const r = store.get(id);
  if (!r) return;

  if (r.completed) {
    await store.update(id, { completed: false, completedAt: null, notifiedFor: null });
    ui.toast("Reminder restored");
    render();
    return;
  }

  if (r.repeat && r.repeat !== "none") {
    const next = sched.advance(r);
    if (next) {
      await store.update(id, { ...next, completed: false, completedAt: null });
      ui.toast(`Completed · next on ${format.shortDate(parseYmd(next.date))}`);
      render();
      return;
    }
  }

  await store.update(id, { completed: true, completedAt: new Date().toISOString() });
  ui.toast("Reminder completed");
  notif.chime();
  render();
}

  const html = `

    <div class="modal-body">

      <div class="field">
        <label for="aiInput">Your reminder</label>
        <textarea class="input" id="aiInput" rows="3" placeholder="Remind me to study Maths tomorrow at 6 PM.">${esc(prefill || "")}</textarea>
      </div>

      <div class="opt-row">
        <button type="button" class="opt" data-sample="Remind me to study Maths tomorrow at 6 PM.">Study Maths tomorrow</button>
        <button type="button" class="opt" data-sample="Remind me every Monday at 5 PM to work on my website.">Weekly website work</button>
        <button type="button" class="opt" data-sample="Pay the electricity bill on Friday at 9 AM, urgent.">Bill on Friday</button>
      </div>

      <div id="aiResult"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" data-close>Cancel</button>
      <button class="btn btn-primary" data-act="parse">${ICON.sparkle} Understand reminder</button>
    </div>`;

  ui.openModal(html, {
    wide: true,
    onMount(modal, close) {
      let candidate = null;

      const result = modal.querySelector("#aiResult");
      const input = modal.querySelector("#aiInput");

      const showPreview = c => {
        candidate = c;
        result.innerHTML = `
          <div class="ai-preview">
            <div class="pv"><div class="k">Task</div><div class="v">${esc(c.title)}<span class="ai-tag">extracted</span></div></div>
            <div class="pv"><div class="k">Date</div><div class="v">${esc(format.fullDate(parseYmd(c.date)))}<span class="ai-tag">extracted</span></div></div>
            <div class="pv"><div class="k">Time</div><div class="v">${esc(format.time(c.time))}<span class="ai-tag">extracted</span></div></div>
            <div class="pv"><div class="k">Category</div><div class="v">${chipCat(c.category)}<span class="ai-tag">suggested</span></div></div>
            <div class="pv"><div class="k">Priority</div><div class="v">${chipPrio(c.priority)}<span class="ai-tag">suggested</span></div></div>
            <div class="pv"><div class="k">Repeat</div><div class="v">${esc(format.repeatLabel(c))}</div></div>
          </div>
          <div style="display:flex;gap:var(--s3);margin-top:var(--s5);flex-wrap:wrap">
            <button class="btn btn-primary inline" data-act="create">${ICON.check} Create reminder</button>
            <button class="btn btn-ghost inline" data-act="edit-details">${ICON.edit} Edit details</button>
          </div>`;
      };

      modal.addEventListener("click", async e => {
        const sample = e.target.closest("[data-sample]");
        if (sample) { input.value = sample.dataset.sample; input.focus(); return; }

        const act = e.target.closest("[data-act]")?.dataset.act;

        if (act === "parse") {
          const text = input.value.trim();
          if (!text) { input.focus(); ui.toast("Type a reminder first", "warn"); return; }
          const c = ai.parse(text);
          if (!c.ok) { ui.toast("I couldn't find a task in that", "warn"); return; }
          showPreview(c);
          return;
        }

        if (act === "create" && candidate) {
          const nr = makeReminder(candidate);
          await store.add(nr);
          lastCreatedId = nr.id;
          ui.toast("Reminder created");
          notif.chime();
          close();
          render();
          return;

        if (act === "edit-details" && candidate) {

      });

      const key = e => {
        if ((e.metaKey || e.ctrlKey) && e.key === "Enter") {
          e.preventDefault();
          modal.querySelector("[data-act='parse']").click();
        }
      };
      modal.addEventListener("keydown", key);
      setTimeout(() => input.focus(), 40);
    }
  });
}

/* --------------------------------------------------------- data actions */
function exportReminders() {
  const payload = { app: "remindly", v: 1, exportedAt: new Date().toISOString(), reminders: store.reminders, prefs: store.prefs };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `remindly-export-${ymd(new Date())}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  ui.toast("Reminders exported");
}

function handleImport(e) {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    try {
      const data = JSON.parse(reader.result);
      const incoming = Array.isArray(data) ? data : data.reminders;
      if (!Array.isArray(incoming)) throw new Error("bad shape");
      const existingIds = new Set(store.reminders.map(r => r.id));
      const cleaned = incoming
        .filter(r => r && r.title && r.date && r.time)
        .map(r => makeReminder({ ...r, id: existingIds.has(r.id) ? uid() : (r.id || uid()) }));
      await store.replaceAll([...store.reminders, ...cleaned]);
      ui.toast(`${cleaned.length} reminder${cleaned.length === 1 ? "" : "s"} imported`);
      render();
    } catch (err) {
      ui.toast("That file couldn't be read", "warn");
    }
    e.target.value = "";
  };
  reader.readAsText(file);
}

/* ----------------------------------------------------------- theming */
function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  store.prefs.theme = theme;
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", theme === "dark" ? "#101211" : "#F4F5F2");
  const icon = $("#themeIcon");
  if (icon) icon.innerHTML = theme === "dark"
    ? '<circle cx="12" cy="12" r="4"/><path d="M12 2.6v2M12 19.4v2M21.4 12h-2M4.6 12h-2M18.6 5.4 17.2 6.8M6.8 17.2 5.4 18.6M18.6 18.6 17.2 17.2M6.8 6.8 5.4 5.4"/>'
    : '<path d="M20.5 14.2A8.4 8.4 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2"/>';
  store.persist();
}

/* ------------------------------------------------------------- events */
document.addEventListener("click", async e => {
  const navBtn = e.target.closest("[data-view]");
  if (navBtn) { go(navBtn.dataset.view); return; }

  const filterBtn = e.target.closest("[data-filter]");
  if (filterBtn) {
    store.ui.filter = filterBtn.dataset.filter;
    render();
    return;
  }

  const actEl = e.target.closest("[data-act]");
  if (!actEl) return;
  const act = actEl.dataset.act;

  // card-scoped actions
  const card = actEl.closest(".rcard");
  const id = actEl.dataset.id || (card && card.dataset.id);

  switch (act) {
    case "add":
      openReminderForm(null);
      break;

    case "assistant":
      openAssistant();
      break;

    case "open-reminders":
      go("reminders");
      break;

    case "view-overdue":
      store.ui.filter = "overdue";
      go("reminders");
      break;

    case "add-on-date": {
      const d = store.ui.calDay || ymd(new Date());
      openReminderForm(null, { date: d });
      break;
    }

    case "toggle":
      if (id) await toggleReminder(id);
      break;

    case "restore":
      if (id) await toggleReminder(id);
      break;

    case "edit":
      if (id) openReminderForm(store.get(id));
      break;

    case "delete":
      if (id) await deleteReminder(id);
      break;

    case "more":
      if (card) card.classList.toggle("open");
      break;

    case "clear-completed": {
      const n = store.reminders.filter(r => r.completed).length;
      if (!n) { ui.toast("Nothing to clear", "info"); break; }
      const ok = await ui.confirm({
        title: `Clear ${n} completed reminder${n === 1 ? "" : "s"}?`,
        body: "Completed reminders will be removed permanently from this device.",
        confirmLabel: "Clear completed",
        danger: true
      });
      if (ok) { await store.clearCompleted(); ui.toast("Completed reminders cleared"); render(); }
      break;
    }

    case "cal-prev": {
      const d = store.ui.calMonth ? parseYmd(store.ui.calMonth) : new Date();
      d.setMonth(d.getMonth() - 1);
      store.ui.calMonth = ymd(d);
      render();
      break;
    }
    case "cal-next": {
      const d = store.ui.calMonth ? parseYmd(store.ui.calMonth) : new Date();
      d.setMonth(d.getMonth() + 1);
      store.ui.calMonth = ymd(d);
      render();
      break;
    }
    case "cal-today":
      store.ui.calMonth = ymd(new Date());
      store.ui.calDay = ymd(new Date());
      render();
      break;
    case "cal-day":
      store.ui.calDay = actEl.dataset.day;
      render();
      break;

    case "theme":
      applyTheme(actEl.dataset.theme);
      render();
      break;

    case "timeformat":
      store.prefs.timeFormat = actEl.dataset.fmt;
      await store.persist();
      ui.toast(`Time format set to ${actEl.dataset.fmt} hour`);
      render();
      break;

    case "toggle-pref": {
      const key = actEl.dataset.pref;
      store.prefs[key] = !store.prefs[key];
      actEl.setAttribute("aria-checked", String(store.prefs[key]));
      await store.persist();
      if (key === "sound" && store.prefs.sound) notif.chime();
      ui.toast(`${key === "sound" ? "Sound" : "Notifications"} ${store.prefs[key] ? "enabled" : "disabled"}`);
      break;
    }

    case "ask-permission": {
      const res = await notif.request();
      ui.toast(res === "granted" ? "Browser notifications enabled" : "Notification permission not granted", res === "granted" ? "ok" : "warn");
      render();
      break;
    }

    case "test-notification":
      notif.browser("Remindly", "Notifications are working correctly.");
      ui.toast("Test notification sent", "info");
      break;

    case "export":
      exportReminders();
      break;

    case "import":
      $("#importFile")?.click();
      break;

    case "save":
    case "create":
    case "parse":
    case "edit-details":
    case "delete-from-form":
      /* handled inside modal scopes */
      break;
    default:
      break;
  }
});

/* top bar */
$("#btnTheme").addEventListener("click", () => {
  applyTheme(store.prefs.theme === "dark" ? "light" : "dark");
  render();
});
$("#btnAssistant").addEventListener("click", () => openAssistant());
$("#fab").addEventListener("click", () => openReminderForm(null));
$("#btnBell").addEventListener("click", async () => {
  const pending = store.reminders
    .filter(r => !r.completed && sched.effective(r) <= Date.now() + 3600000 * 24)
    .sort((a, b) => sched.effective(a) - sched.effective(b));

  const html = `
    <div class="modal-head">
      <h2>Notifications</h2>
      <button class="icon-btn" data-close aria-label="Close">${ICON.close}</button>
    </div>
    <div class="modal-body">
      ${pending.length ? `<div class="list">${pending.slice(0, 8).map(r => reminderCard(r)).join("")}</div>`
      : emptyState({ icon: ICON.bell, title: "You're all caught up", body: "Nothing is due in the next 24 hours.", action: "add", actionLabel: "Add reminder" })}
    </div>
    <div class="modal-foot">
      ${notif.permission() === "default" ? `<button class="btn btn-ghost" data-act="ask-permission">Enable browser notifications</button>` : ""}
      <button class="btn btn-primary" data-close>Close</button>
    </div>`;

  ui.openModal(html, {
    onMount(modal) {
      modal.addEventListener("click", async e => {
        const a = e.target.closest("[data-act]")?.dataset.act;
        if (a === "ask-permission") {
          const res = await notif.request();
          ui.toast(res === "granted" ? "Browser notifications enabled" : "Permission not granted", res === "granted" ? "ok" : "warn");
        }
      });
    }
  });
});

/* keyboard shortcuts */
document.addEventListener("keydown", e => {
  const tag = (e.target.tagName || "").toLowerCase();
  const typing = tag === "input" || tag === "textarea" || tag === "select" || e.target.isContentEditable;

  if (e.key === "Escape") {
    const open = $("#modalRoot .overlay");
    if (open) { open.remove(); return; }
    const card = $(".rcard.open");
    if (card) card.classList.remove("open");
    return;
  }

  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;

  const k = e.key.toLowerCase();
  if (k === "n") { e.preventDefault(); openReminderForm(null); }
  else if (k === "a") { e.preventDefault(); openAssistant(); }
  else if (k === "t") { e.preventDefault(); applyTheme(store.prefs.theme === "dark" ? "light" : "dark"); render(); }
  else if (k === "/") {
    e.preventDefault();
    if (store.ui.view !== "reminders") { go("reminders"); setTimeout(() => $("#searchInput")?.focus(), 60); }
    else $("#searchInput")?.focus();
  }
  else if (k === "1") go("dashboard");
  else if (k === "2") go("reminders");
  else if (k === "3") go("calendar");
  else if (k === "4") go("completed");
  else if (k === "5") go("settings");
});

/* ------------------------------------------------------------- clock */
function tickClock() {
  const now = new Date();
  const c = $("#clock");
  const cd = $("#clockDate");
  if (c) c.textContent = format.timeFromDate(now);
  if (cd) cd.textContent = `${DAYS[now.getDay()]} ${now.getDate()} ${MONTHS_S[now.getMonth()]}`;
}

/* ---------------------------------------------------------------- boot */
(async function boot() {
  // Respect system preference on first run.
  const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;

  await store.init();
  if (!localStorage.getItem(STORAGE_KEY + ".seeded")) {
    applyTheme(store.prefs.theme === "dark" || (prefersDark && store.prefs.theme === "light" && false) ? store.prefs.theme : store.prefs.theme);
    localStorage.setItem(STORAGE_KEY + ".seeded", "1");
  } else {
    applyTheme(store.prefs.theme);
  }
  if (!localStorage.getItem(STORAGE_KEY + ".seeded")) {
    applyTheme(prefersDark ? "dark" : store.prefs.theme);
    localStorage.setItem(STORAGE_KEY + ".seeded", "1");
  }

  render();
  tickClock();
  setInterval(tickClock, 30000);
  notif.start();

  // Highlight the most recently created reminder with the Dawn Sweep.
  const highlight = () => {
    if (!lastCreatedId) return;
    const el = document.querySelector(`.rcard[data-id="${lastCreatedId}"], .rail-node[data-id="${lastCreatedId}"]`);
    if (el && !reduceMotion()) {
      el.classList.add("sweep");
      setTimeout(() => el.classList.remove("sweep"), 620);
    }
    lastCreatedId = null;
  };
  const obs = new MutationObserver(highlight);
  obs.observe(view, { childList: true });
  setTimeout(highlight, 80);

  // Re-render the rail's "now" marker every minute while the dashboard is open.
  setInterval(() => {
    if (store.ui.view === "dashboard" && !$("#modalRoot .overlay")) render();
    updateBadge();
  }, 60000);
})();
</script>
