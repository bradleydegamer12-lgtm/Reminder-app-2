<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Remindly — Time-aware task control</title>
<meta name="description" content="Remindly is a calm, time-aware reminder and task manager. See your day on one rail, capture tasks in seconds, and never miss a deadline.">
<meta name="theme-color" content="#F4F5F2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
/* ============================================================
   REMINDLY — design tokens
   ============================================================ */
:root{
  --canvas:#F4F5F2;
  --surface:#FFFFFF;
  --surface-2:#FAFBF9;
  --ink:#111312;
  --inv:#F7F8F5;
  --muted:#6F7470;
  --line:#D9DDD8;
  --line-strong:#C7CDC7;
  --glass:rgba(255,255,255,0.72);
  --amber:#E2B84B;
  --green:#4E9B73;
  --coral:#C96455;
  --sky:#5D87A8;
  --violet:#8372A8;
  --slate:#8B8F8A;

  --shadow:0 12px 32px rgba(17,19,18,0.08);
  --shadow-lg:0 20px 60px rgba(17,19,18,0.18);
  --blur:blur(14px) saturate(120%);

  --r-lg:20px;
  --r-md:12px;
  --r-pill:999px;

  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s7:32px; --s8:40px; --s9:56px; --s10:80px;

  --ease:cubic-bezier(0.22,1,0.36,1);
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --display:'Space Grotesk','Inter',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
[data-theme="dark"]{
  --canvas:#101211;
  --surface:#191C1A;
  --surface-2:#141715;
  --ink:#F7F8F5;
  --inv:#101211;
  --muted:#9AA09B;
  --line:#343934;
  --line-strong:#454B45;
  --glass:rgba(25,28,26,0.78);
  --shadow:0 12px 32px rgba(0,0,0,0.34);
  --shadow-lg:0 20px 60px rgba(0,0,0,0.55);
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans);
  background:var(--canvas);
  color:var(--ink);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  transition:background-color .3s ease,color .3s ease;
  overflow-x:hidden;
}
img,svg{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px;border-radius:6px}
::selection{background:var(--amber);color:#111312}

/* scrollbars */
*{scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:999px;border:3px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-track{background:transparent}

/* ============================================================
   Typography helpers
   ============================================================ */
.t-display{font-family:var(--display);font-size:48px;font-weight:500;line-height:.98;letter-spacing:-.02em;margin:0}
.t-heading{font-size:28px;font-weight:600;line-height:1.15;letter-spacing:-.015em;margin:0}
.t-title{font-size:17px;font-weight:600;line-height:1.3;letter-spacing:-.01em;margin:0}
.t-body{font-size:15px;font-weight:400;line-height:1.5;margin:0}
.t-label{font-size:11px;font-weight:600;line-height:1.2;letter-spacing:.06em;text-transform:uppercase}
.t-caption{font-size:12px;line-height:1.35;color:var(--muted)}
.t-metric{font-family:var(--display);font-size:42px;font-weight:500;line-height:.95;letter-spacing:-.02em}
.mono{font-family:var(--mono);font-size:12px;line-height:1.4}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* ============================================================
   Shell layout
   ============================================================ */
.sidebar{
  position:fixed;inset:0 auto 0 0;width:240px;
  background:var(--surface);
  border-right:1px solid var(--line);
  padding:var(--s7) var(--s5);
  display:flex;flex-direction:column;gap:var(--s6);
  z-index:40;
  transition:background-color .3s ease,border-color .3s ease,width .25s var(--ease);
}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{
  width:32px;height:32px;border-radius:10px;background:var(--ink);color:var(--canvas);
  display:grid;place-items:center;flex:0 0 auto;
}
[data-theme="dark"] .brand-mark{background:var(--amber);color:#101211}
.brand-name{font-family:var(--display);font-size:19px;font-weight:600;letter-spacing:-.02em}
.brand-sub{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}

.nav{display:flex;flex-direction:column;gap:2px}
.nav-item{
  position:relative;display:flex;align-items:center;gap:12px;
  height:46px;padding:0 12px;border-radius:var(--r-md);
  color:var(--muted);font-size:14px;font-weight:500;width:100%;
  transition:background-color .14s ease,color .14s ease;
}
.nav-item svg{width:20px;height:20px;flex:0 0 auto;transition:transform .14s ease}
.nav-item:hover{background:var(--surface-2);color:var(--ink)}
.nav-item:hover svg{transform:translateX(2px)}
.nav-item.active{color:var(--ink);font-weight:600}
.nav-item.active::before{
  content:"";position:absolute;left:-20px;top:50%;transform:translateY(-50%);
  width:3px;height:22px;border-radius:0 3px 3px 0;background:var(--amber);
}
[data-theme="dark"] .nav-item:hover{background:#20241f}
.nav-label{white-space:nowrap}
.sidebar-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:var(--s5)}
.today-card{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--s4)}
[data-theme="dark"] .today-card{background:#20241f}
.today-card .t-label{color:var(--muted)}
.today-card strong{font-family:var(--display);font-size:15px;font-weight:600;display:block;margin-top:6px;letter-spacing:-.01em}

.main{margin-left:240px;min-height:100vh;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:30;height:72px;flex:0 0 auto;
  display:flex;align-items:center;gap:var(--s4);
  padding:0 var(--s8);
  background:var(--glass);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border-bottom:1px solid var(--line);
}
[data-theme="dark"] .topbar{background:rgba(16,18,17,.72)}
.topbar-title{font-family:var(--display);font-size:20px;font-weight:600;letter-spacing:-.02em}
.topbar-spacer{flex:1}
.icon-btn{
  width:44px;height:44px;border-radius:var(--r-md);display:grid;place-items:center;
  color:var(--muted);border:1px solid transparent;position:relative;
  transition:background-color .14s ease,color .14s ease,border-color .14s ease;
}
.icon-btn:hover{background:var(--surface);color:var(--ink);border-color:var(--line)}
.icon-btn svg{width:20px;height:20px}
.badge{
  position:absolute;top:6px;right:6px;min-width:17px;height:17px;padding:0 4px;
  border-radius:999px;background:var(--coral);color:#fff;
  font-size:10px;font-weight:700;display:grid;place-items:center;line-height:1;
  border:2px solid var(--canvas);
}
.badge[data-zero="1"]{display:none}
.avatar{
  width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--canvas);
  display:grid;place-items:center;font-size:13px;font-weight:600;letter-spacing:.02em;flex:0 0 auto;
}
[data-theme="dark"] .avatar{background:var(--amber);color:#101211}

.content{width:100%;max-width:1280px;margin:0 auto;padding:var(--s8) var(--s8) var(--s10);flex:1}

.bottomnav{display:none}

/* ============================================================
   Buttons / chips / inputs
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  height:48px;padding:0 24px;border-radius:var(--r-pill);
  font-size:15px;font-weight:600;letter-spacing:-.01em;
  transition:transform .14s ease,background-color .14s ease,color .14s ease,border-color .14s ease,box-shadow .14s ease;
  white-space:nowrap;
}
.btn svg{width:18px;height:18px;flex:0 0 auto}
.btn-primary{background:var(--ink);color:var(--canvas)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(17,19,18,.18)}
.btn-primary:active{transform:translateY(0) scale(.98)}
[data-theme="dark"] .btn-primary{background:var(--inv);color:#111312}
.btn-ghost{border:1px solid var(--line-strong);color:var(--ink);background:transparent}
.btn-ghost:hover{background:var(--surface);border-color:var(--ink);transform:translateY(-2px)}
.btn-danger{background:var(--coral);color:#fff}
.btn-danger:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(201,100,85,.28)}
.btn-sm{height:40px;padding:0 16px;font-size:13px}
.btn-block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}

.chip{
  display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 11px;
  border-radius:var(--r-pill);border:1px solid var(--line);
  font-size:11px;font-weight:600;letter-spacing:.03em;color:var(--muted);
  background:var(--surface-2);white-space:nowrap;
}
[data-theme="dark"] .chip{background:#22261f}
.chip .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.chip.cat-school{color:#33506b;border-color:rgba(93,135,168,.36);background:rgba(93,135,168,.10)}
.chip.cat-work{color:#4e4270;border-color:rgba(131,114,168,.36);background:rgba(131,114,168,.10)}
.chip.cat-personal{color:#2f6248;border-color:rgba(78,155,115,.36);background:rgba(78,155,115,.10)}
.chip.cat-important{color:#8c3d31;border-color:rgba(201,100,85,.36);background:rgba(201,100,85,.10)}
.chip.cat-other{color:var(--muted)}
[data-theme="dark"] .chip.cat-school{color:#a8c6de}
[data-theme="dark"] .chip.cat-work{color:#c3b6de}
[data-theme="dark"] .chip.cat-personal{color:#9ed4b6}
[data-theme="dark"] .chip.cat-important{color:#e8a99e}
[data-theme="dark"] .chip.cat-other{color:var(--muted)}
.chip.prio-high{color:#8c3d31;border-color:rgba(201,100,85,.4);background:rgba(201,100,85,.1)}
.chip.prio-medium{color:#7a5c14;border-color:rgba(226,184,75,.5);background:rgba(226,184,75,.13)}
.chip.prio-low{color:var(--muted)}
[data-theme="dark"] .chip.prio-high{color:#e8a99e}
[data-theme="dark"] .chip.prio-medium{color:#e5c77e}
.chip.done{color:#2f6248;border-color:rgba(78,155,115,.4);background:rgba(78,155,115,.12)}
[data-theme="dark"] .chip.done{color:#9ed4b6}

.filter-chip{
  height:38px;padding:0 16px;border-radius:var(--r-pill);
  border:1px solid var(--line);background:transparent;color:var(--muted);
  font-size:13px;font-weight:600;transition:all .14s ease;white-space:nowrap;
}
.filter-chip:hover{color:var(--ink);border-color:var(--line-strong);transform:translateY(-1px)}
.filter-chip.active{background:var(--ink);color:var(--canvas);border-color:var(--ink)}
[data-theme="dark"] .filter-chip.active{background:var(--inv);color:#111312}

.field{display:flex;flex-direction:column;gap:7px}
.field label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.input,select.input,textarea.input{
  width:100%;height:48px;padding:0 15px;border-radius:var(--r-md);
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  font-size:15px;transition:border-color .14s ease,box-shadow .14s ease,background-color .2s ease;
}
textarea.input{height:auto;min-height:92px;padding:13px 15px;line-height:1.5;resize:vertical;font-family:var(--sans)}
.input:focus{outline:none;border-color:var(--sky);box-shadow:0 0 0 3px rgba(93,135,168,.18)}
.input::placeholder{color:var(--muted);opacity:.75}
select.input{
  appearance:none;-webkit-appearance:none;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 19px) 21px,calc(100% - 14px) 21px;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:38px;
}
.search-wrap{position:relative;flex:1;min-width:0}
.search-wrap svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none}
.search-wrap .input{padding-left:43px}

.switch{
  position:relative;width:50px;height:28px;border-radius:999px;flex:0 0 auto;
  background:var(--line-strong);transition:background-color .18s ease;
}
.switch::after{
  content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;
  background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.18);transition:transform .18s var(--ease);
}
.switch[aria-checked="true"]{background:var(--green)}
.switch[aria-checked="true"]::after{transform:translateX(22px)}

.seg{display:inline-flex;padding:4px;gap:4px;border:1px solid var(--line);border-radius:var(--r-pill);background:var(--surface-2)}
[data-theme="dark"] .seg{background:#22261f}
.seg button{height:34px;padding:0 15px;border-radius:var(--r-pill);font-size:12px;font-weight:600;color:var(--muted);transition:all .14s ease}
.seg button.active{background:var(--ink);color:var(--canvas)}
[data-theme="dark"] .seg button.active{background:var(--inv);color:#111312}

/* ============================================================
   Cards
   ============================================================ */
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  transition:background-color .18s ease,border-color .18s ease,box-shadow .18s ease,transform .18s var(--ease);
}
.card-glass{
  background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  box-shadow:var(--shadow);
}
[data-theme="dark"] .card-glass{background:rgba(25,28,26,.78)}
.card-hover:hover{border-color:var(--line-strong);transform:translateY(-2px)}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s4);margin-bottom:var(--s5)}
.section-head .t-label{color:var(--muted);display:block;margin-bottom:6px}

/* ============================================================
   Dashboard — hero
   ============================================================ */
.grid-hero{display:grid;grid-template-columns:2fr 1fr;gap:var(--s6);margin-bottom:var(--s7)}
.hero{
  position:relative;overflow:hidden;border-radius:var(--r-lg);
  background:#101211;color:#F7F8F5;padding:var(--s8);
  min-height:340px;display:flex;flex-direction:column;justify-content:space-between;gap:var(--s6);
}
.hero::after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.06;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='24' height='24' filter='url(%23n)'/></svg>");
}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s6);position:relative;z-index:1}
.hero-eyebrow{color:#9AA09B;letter-spacing:.14em;margin:0 0 14px}
.hero h1{font-family:var(--display);font-size:48px;font-weight:500;line-height:.98;letter-spacing:-.025em;margin:0}
.hero-sum{color:#C9CCC8;margin-top:14px;max-width:44ch;font-size:15px}
.hero-actions{display:flex;flex-wrap:wrap;gap:var(--s3);align-items:center;position:relative;z-index:1}
.btn-inv{background:#F7F8F5;color:#111312}
.btn-inv:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(0,0,0,.32)}
.btn-onblack{border:1px solid rgba(247,248,245,.28);color:#F7F8F5}
.btn-onblack:hover{background:rgba(247,248,245,.1);transform:translateY(-2px)}
.hero-live{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#9AA09B}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 0 rgba(226,184,75,.55);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(226,184,75,.5)}70%{box-shadow:0 0 0 9px rgba(226,184,75,0)}100%{box-shadow:0 0 0 0 rgba(226,184,75,0)}}

.ring-wrap{position:relative;width:148px;height:148px;flex:0 0 auto}
.ring{width:148px;height:148px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8;stroke-linecap:round}
.ring-track{stroke:rgba(247,248,245,.16)}
.ring-fill{stroke:var(--amber);stroke-dasharray:326.7;stroke-dashoffset:326.7;transition:stroke-dashoffset .62s ease-out}
.ring-center{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring-center b{font-family:var(--display);font-size:38px;font-weight:500;line-height:1;letter-spacing:-.02em;display:block}
.ring-center span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#9AA09B;margin-top:6px;display:block}

/* Next reminder card */
.next-card{display:flex;flex-direction:column;padding:var(--s6);position:relative;overflow:hidden}
.next-card::before{content:"";position:absolute;left:0;top:var(--s6);bottom:var(--s6);width:3px;border-radius:0 3px 3px 0;background:var(--amber)}
.next-flag{display:inline-flex;align-items:center;gap:7px;color:var(--muted)}
.next-time{font-family:var(--display);font-size:32px;font-weight:500;letter-spacing:-.02em;line-height:1.05;margin:var(--s4) 0 2px}
.next-title{margin:10px 0 8px}
.next-notes{color:var(--muted);font-size:14px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.next-foot{margin-top:auto;padding-top:var(--s5);display:flex;align-items:center;justify-content:space-between;gap:var(--s3);border-top:1px solid var(--line)}
.countdown{font-family:var(--display);font-size:17px;font-weight:600;letter-spacing:-.01em}

/* Metrics band */
.metrics{
  display:grid;grid-template-columns:repeat(4,1fr);
  border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--surface);
  margin-bottom:var(--s7);
}
.metric{padding:var(--s6) var(--s6);border-right:1px solid var(--line);position:relative}
.metric:last-child{border-right:0}
.metric .t-label{color:var(--muted);display:flex;align-items:center;gap:7px}
.metric .t-metric{margin:14px 0 6px;transition:color .3s ease}
.metric.alert .t-metric{color:var(--coral)}
.metric .bar{height:3px;border-radius:2px;background:var(--line);margin-top:14px;overflow:hidden}
.metric .bar i{display:block;height:100%;width:0;background:var(--ink);border-radius:2px;transition:width .5s var(--ease)}
.metric.alert .bar i{background:var(--coral)}
.metric.done .bar i{background:var(--green)}

/* Dashboard lower */
.grid-lower{display:grid;grid-template-columns:2fr 1fr;gap:var(--s6);align-items:start}

/* Daylight rail */
.rail{padding:var(--s6)}
.rail-body{position:relative;margin-top:var(--s5)}
.rail-line{position:absolute;left:78px;top:6px;bottom:6px;width:1px;background:var(--line)}
.rail-row{position:relative;display:flex;align-items:flex-start;gap:var(--s4);min-height:58px;padding-bottom:2px}
.rail-hour{width:64px;flex:0 0 auto;text-align:right;padding-top:1px}
.rail-tick{width:14px;flex:0 0 auto;display:flex;justify-content:center;padding-top:6px}
.rail-tick i{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--line-strong);background:var(--canvas);display:block}
.rail-row.has .rail-tick i{background:var(--amber);border-color:var(--amber);width:9px;height:9px}
.rail-slot{flex:1;min-width:0;padding-bottom:var(--s3)}
.rail-blank{height:22px;border-radius:8px;background:repeating-linear-gradient(90deg,transparent,transparent 6px,var(--line) 6px,var(--line) 7px);opacity:.5;max-width:120px}
.rail-node{
  display:flex;align-items:center;gap:var(--s3);width:100%;text-align:left;
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);
  padding:11px var(--s4);transition:all .14s ease;
}
[data-theme="dark"] .rail-node{background:#22261f}
.rail-node:hover{border-color:var(--line-strong);transform:translateX(3px)}
.rail-node .ndot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.rail-node .ntitle{font-size:14px;font-weight:600;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rail-node .ntime{margin-left:auto;flex:0 0 auto;color:var(--muted)}
.rail-node.is-done{opacity:.5}
.rail-node.is-done .ntitle{text-decoration:line-through}
.rail-now{position:absolute;left:78px;right:0;height:2px;background:var(--amber);border-radius:2px;z-index:2}
.rail-now::before{content:"";position:absolute;left:-5px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--amber)}
.rail-now span{
  position:absolute;right:0;top:-22px;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:#111312;background:var(--amber);padding:2px 7px;border-radius:999px;
}
[data-theme="dark"] .rail-now span{color:#111311}

/* Category pulse */
.pulse-row{display:flex;flex-direction:column;gap:8px;padding:var(--s4) 0;border-bottom:1px solid var(--line)}
.pulse-row:last-child{border-bottom:0}
.pulse-top{display:flex;align-items:center;gap:10px}
.pulse-top .dot{width:9px;height:9px;border-radius:3px}
.pulse-top b{font-size:14px;font-weight:600}
.pulse-top .cnt{margin-left:auto;font-family:var(--display);font-size:17px;font-weight:600}
.pulse-bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.pulse-bar i{display:block;height:100%;border-radius:2px;width:0;transition:width .5s var(--ease)}

/* ============================================================
   Reminder cards
   ============================================================ */
.list{display:flex;flex-direction:column;gap:var(--s3)}
.rcard{
  display:flex;gap:var(--s4);align-items:flex-start;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:var(--s5);position:relative;overflow:hidden;
  transition:border-color .18s ease,transform .18s var(--ease),background-color .18s ease;
}
.rcard:hover{border-color:var(--line-strong);transform:translateY(-1px)}
.rcard.overdue{border-color:rgba(201,100,85,.42)}
.rcard.is-done{opacity:.62}
.rcard.is-done .rc-title{text-decoration:line-through;text-decoration-thickness:1px}
.rcard.is-done .rc-notes{display:none}
.check{
  width:24px;height:24px;flex:0 0 auto;margin-top:2px;border-radius:8px;
  border:1.75px solid var(--line-strong);display:grid;place-items:center;
  transition:all .16s var(--ease);position:relative;
}
.check::before{content:"";position:absolute;inset:-12px}
.check svg{width:14px;height:14px;color:#fff;opacity:0;transform:scale(.6);transition:all .16s var(--ease)}
.check:hover{border-color:var(--green)}
.check[aria-checked="true"]{background:var(--green);border-color:var(--green)}
.check[aria-checked="true"] svg{opacity:1;transform:scale(1)}
.rc-main{flex:1;min-width:0}
.rc-chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:9px}
.rc-title{font-size:17px;font-weight:600;letter-spacing:-.012em;margin:0;word-break:break-word}
.rc-notes{color:var(--muted);font-size:14px;line-height:1.5;margin:6px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rc-meta{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s4);margin-top:12px}
.rc-meta span{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.rc-meta svg{width:14px;height:14px}
.rc-meta .due-hot{color:var(--coral);font-weight:600}
.rc-meta .due-warm{color:#8a6a12;font-weight:600}
[data-theme="dark"] .rc-meta .due-warm{color:#e5c77e}
.rc-actions{display:flex;gap:2px;flex:0 0 auto;opacity:0;transition:opacity .14s ease}
.rcard:hover .rc-actions,.rcard:focus-within .rc-actions{opacity:1}
.rc-actions .icon-btn{width:38px;height:38px;border-radius:10px}
.rc-actions .icon-btn.del:hover{background:rgba(201,100,85,.12);color:var(--coral);border-color:rgba(201,100,85,.3)}
.rc-more{display:none}

/* Dawn sweep */
@keyframes dawnIn{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:translateX(0)}}
@keyframes scan{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.sweep{animation:dawnIn .52s var(--ease) both}
.sweep::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(226,184,75,.42),transparent);
  width:40%;animation:scan .52s var(--ease) both;
}

/* ============================================================
   Toolbar / filters
   ============================================================ */
.toolbar{display:flex;flex-wrap:wrap;gap:var(--s3);align-items:center;margin-bottom:var(--s5)}
.filters{display:flex;gap:var(--s2);flex-wrap:wrap}
.result-count{margin:0 0 var(--s4);color:var(--muted);font-size:13px}

/* ============================================================
   Empty state
   ============================================================ */
.empty{
  text-align:center;padding:var(--s9) var(--s6);border:1px dashed var(--line-strong);
  border-radius:var(--r-lg);background:var(--surface);
}
.empty .ei{width:52px;height:52px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;margin:0 auto var(--s5);color:var(--muted)}
[data-theme="dark"] .empty .ei{background:#22261f}
.empty h3{font-family:var(--display);font-size:22px;font-weight:500;letter-spacing:-.02em;margin:0 0 10px}
.empty p{color:var(--muted);margin:0 auto var(--s6);max-width:38ch;font-size:14px}

/* ============================================================
   Alert (overdue)
   ============================================================ */
.alert{
  display:flex;align-items:center;gap:var(--s4);padding:var(--s4) var(--s5);
  border:1px solid rgba(201,100,85,.4);background:rgba(201,100,85,.08);
  border-radius:var(--r-lg);margin-bottom:var(--s6);
}
.alert svg{width:22px;height:22px;color:var(--coral);flex:0 0 auto}
.alert b{color:var(--coral)}
.alert .btn{margin-left:auto}

/* ============================================================
   Calendar
   ============================================================ */
.cal-grid-wrap{display:grid;grid-template-columns:7fr 5fr;gap:var(--s6);align-items:start}
.cal-head{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s5)}
.cal-title{font-family:var(--display);font-size:26px;font-weight:600;letter-spacing:-.02em;margin:0}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:8px}
.cal-dow span{text-align:center;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 0}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-day{
  min-height:82px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);
  padding:9px 10px;text-align:left;display:flex;flex-direction:column;gap:6px;
  transition:all .14s ease;position:relative;
}
.cal-day:hover{border-color:var(--ink);transform:translateY(-2px)}
.cal-day .dnum{font-family:var(--display);font-size:15px;font-weight:600;letter-spacing:-.01em}
.cal-day.out{opacity:.5;background:transparent;border-style:dashed}
.cal-day.today{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
.cal-day.today .dnum{color:#8a6a12}
[data-theme="dark"] .cal-day.today .dnum{color:var(--amber)}
.cal-day.sel{background:var(--ink);color:var(--canvas);border-color:var(--ink)}
.cal-day.sel .cal-dot{border-color:rgba(255,255,255,.35)}
.cal-dots{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto}
.cal-dot{width:7px;height:7px;border-radius:50%;border:1px solid transparent}
.cal-more{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.day-panel{position:sticky;top:96px}
.day-panel .list{max-height:none}

/* ============================================================
   Settings
   ============================================================ */
.settings-wrap{max-width:760px}
.set-section{margin-bottom:var(--s7)}
.set-section > .t-label{color:var(--muted);display:block;margin-bottom:var(--s3);padding-bottom:var(--s3);border-bottom:1px solid var(--line)}
.set-row{display:flex;align-items:center;gap:var(--s5);padding:var(--s5) 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row .rt{flex:1;min-width:0}
.set-row .rt b{display:block;font-size:15px;font-weight:600;letter-spacing:-.01em}
.set-row .rt span{display:block;color:var(--muted);font-size:13px;margin-top:3px;line-height:1.45}
.set-row .rc{flex:0 0 auto;display:flex;gap:var(--s2);align-items:center}
.set-row .input{width:170px;height:42px}

/* ============================================================
   Modal / dialogs / toasts
   ============================================================ */
.overlay{
  position:fixed;inset:0;z-index:80;background:rgba(12,14,13,.44);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:var(--s5);
  animation:fade .18s ease both;overflow-y:auto;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.modal{
  width:100%;max-width:560px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-lg);box-shadow:var(--shadow-lg);animation:rise .18s var(--ease) both;
  max-height:calc(100vh - 40px);display:flex;flex-direction:column;overflow:hidden;
}
.modal.wide{max-width:620px}
.modal-head{display:flex;align-items:center;gap:var(--s4);padding:var(--s6);border-bottom:1px solid var(--line)}
.modal-head h2{font-family:var(--display);font-size:22px;font-weight:600;letter-spacing:-.02em;margin:0;flex:1}
.modal-body{padding:var(--s6);overflow-y:auto;display:flex;flex-direction:column;gap:var(--s5)}
.modal-foot{padding:var(--s5) var(--s6);border-top:1px solid var(--line);display:flex;gap:var(--s3);justify-content:flex-end;flex-wrap:wrap}
.form-2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4)}
.opt-row{display:flex;flex-wrap:wrap;gap:var(--s2)}
.opt{
  height:40px;padding:0 15px;border-radius:var(--r-pill);border:1px solid var(--line);
  font-size:13px;font-weight:600;color:var(--muted);transition:all .14s ease;display:inline-flex;align-items:center;gap:7px;
}
.opt:hover{border-color:var(--line-strong);color:var(--ink)}
.opt.active{background:var(--ink);color:var(--canvas);border-color:var(--ink)}
[data-theme="dark"] .opt.active{background:var(--inv);color:#111312}
.opt .sw{width:11px;height:11px;border-radius:50%}
.confirm{max-width:410px}
.confirm .modal-body{gap:var(--s3)}
.confirm h2{font-family:var(--display);font-size:21px;font-weight:600;letter-spacing:-.02em;margin:0}

.toasts{position:fixed;right:var(--s6);bottom:var(--s6);z-index:100;display:flex;flex-direction:column;gap:10px;align-items:flex-end;pointer-events:none}
.toast{
  display:flex;align-items:center;gap:11px;padding:13px 18px;border-radius:var(--r-pill);
  background:#111312;color:#F7F8F5;font-size:14px;font-weight:500;box-shadow:var(--shadow-lg);
  animation:toastIn .28s var(--ease) both;max-width:min(92vw,380px);pointer-events:auto;
}
.toast.out{animation:toastOut .22s ease both}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes toastOut{to{opacity:0;transform:translateY(10px) scale(.98)}}
.toast svg{width:18px;height:18px;flex:0 0 auto}
.toast.ok svg{color:#7dd0a2}
.toast.warn svg{color:#e8a99e}
.toast.info svg{color:var(--amber)}

/* AI panel */
.ai-hint{
  display:flex;align-items:center;gap:10px;padding:13px 16px;border-radius:var(--r-md);
  border:1px dashed var(--line-strong);background:var(--surface-2);color:var(--muted);font-size:13px;
  cursor:pointer;transition:all .14s ease;width:100%;text-align:left;
}
[data-theme="dark"] .ai-hint{background:#22261f}
.ai-hint:hover{border-color:var(--sky);color:var(--ink)}
.ai-hint svg{width:16px;height:16px;color:var(--amber);flex:0 0 auto}
.ai-preview{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.ai-preview .pv{display:flex;gap:var(--s4);padding:13px var(--s5);border-bottom:1px solid var(--line);align-items:flex-start}
.ai-preview .pv:last-child{border-bottom:0}
.ai-preview .pv .k{width:92px;flex:0 0 auto;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding-top:2px}
.ai-preview .pv .v{font-size:14px;font-weight:500;line-height:1.45}
.ai-tag{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px;margin-left:8px}

/* ============================================================
   Page transition
   ============================================================ */
.view-in{animation:viewIn .18s ease-out both}
@keyframes viewIn{from{opacity:0;transform:translateX(var(--dir,12px))}to{opacity:1;transform:translateX(0)}}

/* skeleton */
.skel{background:linear-gradient(90deg,var(--line) 25%,var(--surface-2) 50%,var(--line) 75%);background-size:200% 100%;animation:shimmer 1.1s linear infinite;border-radius:var(--r-md)}
@keyframes shimmer{to{background-position:-200% 0}}

/* ============================================================
   Responsive — tablet
   ============================================================ */
@media (max-width:1023px){
  .sidebar{width:72px;padding:var(--s6) 12px;align-items:center}
  .brand-name,.brand-sub,.nav-label,.sidebar-foot{display:none}
  .nav-item{justify-content:center;padding:0}
  .nav-item.active::before{left:-12px}
  .main{margin-left:72px}
  .content{padding:var(--s6) var(--s6) var(--s10)}
  .topbar{padding:0 var(--s6)}
  .grid-hero{grid-template-columns:1fr}
  .grid-lower{grid-template-columns:1fr}
  .metrics{grid-template-columns:1fr 1fr}
  .metric:nth-child(2){border-right:0}
  .metric:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .hero h1{font-size:38px}
  .cal-grid-wrap{grid-template-columns:1fr}
  .day-panel{position:static}
}

/* ============================================================
   Responsive — mobile
   ============================================================ */
@media (max-width:767px){
  .sidebar{display:none}
  .main{margin-left:0}
  .topbar{height:64px;padding:0 var(--s4);gap:var(--s2)}
  .topbar-title{font-size:18px}
  .content{padding:var(--s5) var(--s4) 104px}
  .t-display,.hero h1{font-size:34px}
  .t-heading{font-size:22px}
  .hero{padding:var(--s6);min-height:0}
  .hero-top{flex-direction:column-reverse;align-items:flex-start;gap:var(--s5)}
  .ring-wrap,.ring{width:112px;height:112px}
  .ring-center b{font-size:28px}
  .metrics{grid-template-columns:1fr 1fr}
  .metric{padding:var(--s5)}
  .metric .t-metric{font-size:34px}
  .grid-hero,.grid-lower{gap:var(--s4);margin-bottom:var(--s6)}
  .cal-day{min-height:58px;padding:6px}
  .cal-day .dnum{font-size:13px}
  .cal-dots{gap:3px}
  .cal-dot{width:5px;height:5px}
  .cal-more{display:none}
  .rc-actions{display:none}
  .rc-more{display:grid}
  .rcard.open .rc-actions{
    display:flex;opacity:1;position:absolute;right:var(--s5);top:var(--s5);
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:4px;
    box-shadow:var(--shadow);z-index:3;
  }
  .rail-line,.rail-now{left:56px}
  .rail-hour{width:44px;font-size:11px}
  .rail-now span{top:-20px;font-size:9px}
  .btn{height:50px;width:100%}
  .btn-sm,.btn.inline{width:auto}
  .modal-foot .btn{width:100%}
  .modal-foot{flex-direction:column-reverse}
  .form-2{grid-template-columns:1fr}
  .toolbar{gap:var(--s2)}
  .filters{flex-wrap:nowrap;overflow-x:auto;width:100%;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .search-wrap{width:100%;flex:1 1 100%}
  .toasts{right:var(--s4);left:var(--s4);bottom:calc(84px + env(safe-area-inset-bottom));align-items:stretch}
  .toast{max-width:none}
  .set-row{flex-wrap:wrap;gap:var(--s3)}
  .set-row .input{width:100%}
  .set-row .rc{width:100%}
  .day-panel .btn{width:100%}

  .bottomnav{
    display:grid;grid-template-columns:repeat(5,1fr);
    position:fixed;left:0;right:0;bottom:0;z-index:60;
    height:calc(72px + env(safe-area-inset-bottom));
    padding-bottom:env(safe-area-inset-bottom);
    background:var(--surface);border-top:1px solid var(--line);
  }
  .bn-item{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
    color:var(--muted);font-size:10px;font-weight:600;letter-spacing:.02em;position:relative;
    transition:color .14s ease;
  }
  .bn-item svg{width:22px;height:22px}
  .bn-item.active{color:var(--ink)}
  .bn-item.active::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:26px;height:3px;border-radius:0 0 3px 3px;background:var(--amber)}
  .fab{
    position:fixed;right:var(--s4);bottom:calc(88px + env(safe-area-inset-bottom));z-index:55;
    width:56px;height:56px;border-radius:50%;background:var(--ink);color:var(--canvas);
    display:grid;place-items:center;box-shadow:var(--shadow-lg);
  }
  [data-theme="dark"] .fab{background:var(--inv);color:#111312}
  .fab svg{width:24px;height:24px}
}
@media (min-width:768px){ .fab{display:none} }

@media (max-width:400px){
  .metrics{grid-template-columns:1fr}
  .metric{border-right:0;border-bottom:1px solid var(--line)}
  .metric:last-child{border-bottom:0}
}

/* ============================================================
   Reduced motion
   ============================================================ */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;animation-iteration-count:1 !important;
    transition-duration:.001ms !important;scroll-behavior:auto !important;
  }
  .sweep::after{display:none}
  .ring-fill{transition:none}
}
</style>
</head>
<body>

    <div class="brand-mark" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/></svg>
    </div>
    <div>
      <div class="brand-name">Remindly</div>

    </div>

  <nav class="nav" id="nav">

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5h4v5"/></svg>
      <span class="nav-label">Dashboard</span>

      <span class="nav-label">Reminders</span>
    </button>
    <button class="nav-item" data-view="calendar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span class="nav-label">Calendar</span>
    </button>
    <button class="nav-item" data-view="completed">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8.2 12.2 2.6 2.6 5-5.6"/></svg>
      <span class="nav-label">Completed</span>

    <button class="nav-item" data-view="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.1"/><path d="M12 2.6v2.2M12 19.2v2.2M21.4 12h-2.2M4.8 12H2.6M18.6 5.4l-1.6 1.6M7 17l-1.6 1.6M18.6 18.6 17 17M7 7 5.4 5.4"/></svg>
      <span class="nav-label">Settings</span>
    </button>
  </nav>

  <div class="sidebar-foot">
    <div class="today-card">
      <div class="t-label">Local time</div>
      <strong id="clock">--:--</strong>
      <div class="t-caption" style="margin-top:6px" id="clockDate">—</div>
    </div>
  </div>
</aside>

<!-- ================= MAIN ================= -->
<div class="main">
  <header class="topbar">
    <div class="topbar-title" id="pageTitle">Dashboard</div>
    <div class="topbar-spacer"></div>

    <button class="icon-btn" id="btnAssistant" aria-label="Open AI reminder assistant" title="AI assistant (A)">

  restore: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11a8 8 0 1 1 2.4 5.7"/><path d="M4 5.5V11h5.5"/></svg>',
  inbox: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 13.5 6 5.2h12l2.5 8.3v5.3H3.5z"/><path d="M3.5 13.5h4.2l1.1 2.4h6.4l1.1-2.4h4.2"/></svg>'
};

/* ---------------------------------------------------------- data source */
/**
 * Persistence seam. Swap `localStorageSource` for a remote implementation
 * (Supabase / Firebase / REST) without touching the rest of the app:
 *
 *   const dataSource = createSupabaseSource(supabaseClient);
 *
 * Contract: load() -> Promise<{reminders, prefs}>, save(payload) -> Promise<void>
 */
const STORAGE_KEY = "remindly.v1";
const localStorageSource = {
  async load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { console.warn("Remindly: could not read storage", e); return null; }
  },
  async save(payload) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(payload)); }
    catch (e) { console.warn("Remindly: could not persist", e); }
  }
};
const dataSource = localStorageSource;

/* --------------------------------------------------------------- store */
const DEFAULT_PREFS = {
  theme: "light",
  notifications: true,
  sound: true,
  volume: 0.5,
  duration: 30,
  timeFormat: "12",
  userName: "Bradley"
};

const store = {
  reminders: [],
  prefs: { ...DEFAULT_PREFS },
  ui: {
    view: "dashboard",
    filter: "all",
    query: "",
    sort: "time",
    calMonth: null,
    calDay: null
  },

  async init() {
    const data = await dataSource.load();
    if (data && Array.isArray(data.reminders)) {
      this.reminders = data.reminders;
      this.prefs = { ...DEFAULT_PREFS, ...(data.prefs || {}) };
    } else {
      this.reminders = seedReminders();
      this.prefs = { ...DEFAULT_PREFS };
      await this.persist();
    }
  },
  async persist() {
    await dataSource.save({ v: 1, reminders: this.reminders, prefs: this.prefs });
  },
  get(id) { return this.reminders.find(r => r.id === id); },
  add(r) { this.reminders.push(r); return this.persist(); },
  update(id, patch) {
    const r = this.get(id);
    if (!r) return this.persist();
    Object.assign(r, patch, { updatedAt: new Date().toISOString() });
    return this.persist();
  },
  async remove(id) {
    this.reminders = this.reminders.filter(r => r.id !== id);
    await this.persist();
  },
  async clearCompleted() {
    this.reminders = this.reminders.filter(r => !r.completed);
    await this.persist();
  },
  async replaceAll(list) {
    this.reminders = list;
    await this.persist();
  }
};

function makeReminder(o) {
  return {
    id: uid(),
    title: "Untitled reminder",
    notes: "",
    date: ymd(new Date()),
    time: "09:00",
    repeat: "none",
    custom: { every: 1, unit: "days" },
    priority: "medium",
    category: "Other",
    color: null,
    icon: null,
    notify: true,
    completed: false,
    completedAt: null,
    notifiedFor: null,
    createdAt: new Date().toISOString(),
    updatedAt: new Date().toISOString(),
    ...o
  };
}

function seedReminders() {
  const t = new Date();
  const d = n => { const x = new Date(t); x.setDate(x.getDate() + n); return ymd(x); };
  return [
    makeReminder({ title: "Water the plants", notes: "Kitchen ferns and the balcony herbs.", date: d(0), time: "08:00", category: "Personal", priority: "low", repeat: "daily", completed: true, completedAt: new Date().toISOString() }),
    makeReminder({ title: "Team stand-up", notes: "Quick sync — bring the sprint board up to date.", date: d(0), time: "09:30", category: "Work", priority: "medium", repeat: "daily", completed: true, completedAt: new Date().toISOString() }),
    makeReminder({ title: "Maths revision", notes: "Chapter 6 — integration by parts. 40 minutes, no phone.", date: d(0), time: "18:00", category: "School", priority: "high", repeat: "weekly", notify: true }),
    makeReminder({ title: "Submit science project", notes: "Upload the PDF before the portal closes at midnight.", date: d(0), time: "20:30", category: "School", priority: "high", repeat: "none" }),
    makeReminder({ title: "Review website update", notes: "Check the new landing copy and the mobile breakpoints.", date: d(1), time: "17:00", category: "Work", priority: "medium", repeat: "none" }),
    makeReminder({ title: "Grocery run", notes: "Oats, milk, spinach, coffee, chicken.", date: d(1), time: "11:00", category: "Personal", priority: "low", repeat: "weekly" }),
    makeReminder({ title: "Plan next week", notes: "Block three deep-work sessions and move the admin to Friday.", date: d(5), time: "09:00", category: "Work", priority: "low", repeat: "weekly" }),
    makeReminder({ title: "Dentist appointment", notes: "Bring the insurance card.", date: d(3), time: "15:00", category: "Personal", priority: "medium", repeat: "none" }),
    makeReminder({ title: "Pay electricity bill", notes: "Standing order failed last month — do it manually.", date: d(-2), time: "09:00", category: "Important", priority: "high", repeat: "monthly", notify: true })
  ];
}

/* ------------------------------------------------------------- format */
const DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const DAYS_S = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const MONTHS_S = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

function ymd(d) { return `{d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function parseYmd(s) { const [y, m, d] = String(s).split("-").map(Number); return new Date(y, m - 1, d); }
function startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }

const format = {
  fullDate(d) { return `${DAYS[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; },
  shortDate(d) {
    const today = startOfDay(new Date()), dd = startOfDay(d);
    const diff = Math.round((dd - today) / 86400000);
    if (diff === 0) return "Today";
    if (diff === 1) return "Tomorrow";
    if (diff === -1) return "Yesterday";
    if (diff > 1 && diff < 7) return DAYS[d.getDay()];
    return `${d.getDate()} ${MONTHS_S[d.getMonth()]}`;
  },
  time(hhmm) {
    const [h, m] = String(hhmm).split(":").map(Number);
    if (store.prefs.timeFormat === "24") return `${pad(h)}:${pad(m)}`;
    const ap = h >= 12 ? "PM" : "AM";
    const h12 = h % 12 === 0 ? 12 : h % 12;
    return `${h12}:${pad(m)} ${ap}`;
  },
  timeFromDate(d) { return format.time(`${pad(d.getHours())}:${pad(d.getMinutes())}`); },
  relative(dt) {
    const now = new Date();
    let ms = dt - now;
    const past = ms < 0;
    ms = Math.abs(ms);
    const mins = Math.round(ms / 60000);
    const days = Math.floor(mins / 1440);
    const hours = Math.floor((mins % 1440) / 60);
    const m = mins % 60;
    let body;
    if (mins < 1) body = "now";
    else if (mins < 60) body = `${mins}m`;
    else if (days === 0) body = hours + "h" + (m ? ` ${m}m` : "");
    else if (days < 7) body = `${days}d ${hours}h`;
    else body = `${Math.round(days / 7)}w`;
    if (body === "now") return "Due now";
    return past ? `Overdue by ${body}` : `Due in ${body}`;
  },
  repeatLabel(r) {
    if (r.repeat === "none") return "Does not repeat";
    if (r.repeat === "daily") return "Daily";
    if (r.repeat === "weekly") return "Weekly";
    if (r.repeat === "monthly") return "Monthly";
    const c = r.custom || { every: 1, unit: "days" };
    const unit = c.unit === "days" ? (c.every === 1 ? "day" : "days")
      : c.unit === "weeks" ? (c.every === 1 ? "week" : "weeks")
        : (c.every === 1 ? "month" : "months");
    return `Every ${c.every} ${unit}`;
  }
};

/* -------------------------------------------------------------- sched */
const sched = {
  /** Concrete Date at which this reminder currently fires. */
  due(r) {
    const [h, m] = String(r.time).split(":").map(Number);
    const d = parseYmd(r.date);
    d.setHours(h, m, 0, 0);
    return d;
  },
  /** Next occurrence on/after today; falls back to the original date (overdue). */
  effective(r) {
    const from = startOfDay(new Date());
    const to = new Date(from); to.setFullYear(to.getFullYear() + 2);
    const occ = sched.occurrences(r, from, to);
    return occ.length ? occ[0] : sched.due(r);
  },
  /** All occurrences of `r` between two Date bounds (inclusive start). */
  occurrences(r, from, to) {
    const out = [];
    let d = sched.due(r);
    if (r.repeat === "none") { if (d >= from && d <= to) out.push(d); return out; }
    const c = r.custom || { every: 1, unit: "days" };
    let guard = 0;
    while (d <= to && guard++ < 800) {
      if (d >= from) out.push(new Date(d));
      if (r.repeat === "daily") d.setDate(d.getDate() + 1);
      else if (r.repeat === "weekly") d.setDate(d.getDate() + 7);
      else if (r.repeat === "monthly") {
        const day = d.getDate();
        d.setDate(1); d.setMonth(d.getMonth() + 1);
        const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
        d.setDate(Math.min(day, last));
      } else if (r.repeat === "custom") {
        const n = Math.max(1, Number(c.every) || 1);
        if (c.unit === "days") d.setDate(d.getDate() + n);
        else if (c.unit === "weeks") d.setDate(d.getDate() + 7 * n);
        else {
          const day = d.getDate();
          d.setDate(1); d.setMonth(d.getMonth() + n);
          const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
          d.setDate(Math.min(day, last));
        }
      } else break;
    }
    return out;
  },
  onDate(r, dateObj) {
    const from = startOfDay(dateObj);
    const to = new Date(from); to.setHours(23, 59, 59, 999);
    return sched.occurrences(r, from, to).length > 0;
  },
  isOverdue(r) {
    return !r.completed && sched.effective(r) < new Date();
  },
  isDueToday(r) {
    return ymd(sched.effective(r)) === ymd(new Date());
  },
  /** Advance a repeating reminder to its next occurrence. */
  advance(r) {
    const from = new Date(sched.due(r).getTime() + 60000);
    const to = new Date(from); to.setFullYear(to.getFullYear() + 2);
    const next = sched.occurrences(r, from, to)[0];
    if (!next) return null;
    return { date: ymd(next), time: `${pad(next.getHours())}:${pad(next.getMinutes())}`, notifiedFor: null };
  }
};

/* --------------------------------------------------------------- notif */
const notif = {
  audioCtx: null,
  supported: typeof Notification !== "undefined",

  permission() { return this.supported ? Notification.permission : "unsupported"; },

  async request() {
    if (!this.supported) return "unsupported";
    try { return await Notification.requestPermission(); }
    catch (e) { return "denied"; }
  },

  browser(title, body) {
    if (!this.supported || Notification.permission !== "granted") return;
    try {
      const n = new Notification(title, {
        body,
        tag: "remindly-" + Date.now(),
        silent: !store.prefs.sound
      });
      n.onclick = () => { window.focus(); n.close(); };
    } catch (e) { /* some browsers throw outside a user gesture context */ }
  },

  chime() {
    if (!store.prefs.sound) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!this.audioCtx) this.audioCtx = new AC();
      const ctx = this.audioCtx;
      if (ctx.state === "suspended") ctx.resume();
      const t0 = ctx.currentTime;
      const vol = clamp(Number(store.prefs.volume) || 0, 0, 1) * 0.22;
      [[880, 0], [1174.7, 0.14]].forEach(([f, off]) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.value = f;
        gain.gain.setValueAtTime(0.0001, t0 + off);
        gain.gain.exponentialRampToValueAtTime(vol, t0 + off + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + off + 0.36);
        osc.connect(gain).connect(ctx.destination);
        osc.start(t0 + off);
        osc.stop(t0 + off + 0.4);
      });
    } catch (e) { /* audio is a progressive enhancement */ }
  },

  fire(r) {
    const body = `${format.time(r.time)} · ${r.category} · ${format.repeatLabel(r)}`;
    this.browser(`Remindly · ${r.title}`, body);
    ui.toast(r.title, "info");
    this.chime();
  },

  tick() {
    if (!store.prefs.notifications) return;
    const now = Date.now();
    let changed = false;
    store.reminders.forEach(r => {
      if (r.completed || !r.notify) return;
      const when = sched.effective(r).getTime();
      const key = String(when);
      if (when <= now && r.notifiedFor !== key) {
        r.notifiedFor = key;
        changed = true;
        notif.fire(r);
      }
    });
    if (changed) store.persist();
  },

  start() {
    this.tick();
    setInterval(() => this.tick(), 15000);
  }
};

/* ------------------------------------------------------------------ ai */
/**
 * Deterministic natural-language extractor.
 * Returns a typed candidate so the UI can show a confirmation summary first.
 */
const ai = {
  parse(text) {
    const raw = String(text || "").trim();
    let t = " " + raw.toLowerCase().replace(/[.!?,;]$/, "") + " ";
    const now = new Date();

    let date = new Date(now);
    let timeGiven = false;
    let repeat = "none";
    let custom = { every: 1, unit: "days" };
    let priority = null;
    let category = null;

    /* ---- repeat ---- */
    const everyN = t.match(/every\s+(\d+)\s*(day|days|week|weeks|month|months)/);
    const everyWeekday = t.match(/every\s+(sunday|monday|tuesday|wednesday|thursday|friday|saturday|sun|mon|tue|tues|wed|thu|thur|thurs|fri|sat)\b/);
    if (everyN) {
      repeat = "custom";
      custom = { every: Number(everyN[1]), unit: everyN[2].startsWith("day") ? "days" : everyN[2].startsWith("week") ? "weeks" : "months" };
      t = t.replace(everyN[0], " ");
    } else if (/\bevery\s*day\b|\bdaily\b/.test(t)) {
      repeat = "daily"; t = t.replace(/\bevery\s*day\b|\bdaily\b/g, " ");
    } else if (/\bevery\s*week\b|\bweekly\b/.test(t)) {
      repeat = "weekly"; t = t.replace(/\bevery\s*week\b|\bweekly\b/g, " ");
    } else if (/\bevery\s*month\b|\bmonthly\b/.test(t)) {
      repeat = "monthly"; t = t.replace(/\bevery\s*month\b|\bmonthly\b/g, " ");
    } else if (everyWeekday) {
      repeat = "weekly";
      const idx = weekdayIndex(everyWeekday[1]);
      const delta = (idx - now.getDay() + 7) % 7 || 7;
      date = new Date(now); date.setDate(date.getDate() + delta);
      t = t.replace(everyWeekday[0], " ");
    }

    /* ---- date ---- */
    const inN = t.match(/\bin\s+(\d+)\s*(day|days|week|weeks|month|months)\b/);
    const onMonthDay = t.match(/\b(?:on\s+)?(january|february|march|april|may|june|july|august|september|october|november|december|jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)\s+(\d{1,2})(?:st|nd|rd|th)?\b/);
    const dayMonth = t.match(/\b(?:on\s+)?(\d{1,2})(?:st|nd|rd|th)?\s+(?:of\s+)?(january|february|march|april|may|june|july|august|september|october|november|december|jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)\b/);
    const weekday = t.match(/\b(?:on|this|next)\s+(sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b|\b(sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/);

    if (/\btomorrow\b/.test(t)) {
      date = new Date(now); date.setDate(date.getDate() + 1);
      t = t.replace(/\btomorrow\b/g, " ");
    } else if (/\btoday\b|\btonight\b|\bthis evening\b/.test(t)) {
      date = new Date(now);
      if (/\btonight\b|\bthis evening\b/.test(t) && !/\bat\s+\d/.test(t)) { timeGiven = true; date.setHours(20, 0, 0, 0); }
      t = t.replace(/\btoday\b|\btonight\b|\bthis evening\b/g, " ");
    } else if (/\bnext week\b/.test(t)) {
      date = new Date(now); date.setDate(date.getDate() + 7);
      t = t.replace(/\bnext week\b/g, " ");
    } else if (inN) {
      const n = Number(inN[1]);
      date = new Date(now);
      if (inN[2].startsWith("day")) date.setDate(date.getDate() + n);
      else if (inN[2].startsWith("week")) date.setDate(date.getDate() + 7 * n);
      else date.setMonth(date.getMonth() + n);
      t = t.replace(inN[0], " ");
    } else if (onMonthDay || dayMonth) {
      const m = onMonthDay || dayMonth;
      const monName = (onMonthDay ? m[1] : m[2]).slice(0, 3);
      const monIdx = MONTHS_S.findIndex(x => x.toLowerCase() === monName);
      const dayNum = Number(onMonthDay ? m[2] : m[1]);
      date = new Date(now.getFullYear(), monIdx, dayNum);
      if (date < startOfDay(now)) date.setFullYear(date.getFullYear() + 1);
      t = t.replace(m[0], " ");
    } else if (weekday && !everyWeekday) {
      const name = weekday[1] || weekday[2];
      const idx = weekdayIndex(name);
      let delta = (idx - now.getDay() + 7) % 7;
      if (delta === 0) delta = 7;
      if (/this\s+/.test(weekday[0])) delta = (idx - now.getDay() + 7) % 7;
      date = new Date(now); date.setDate(date.getDate() + delta);
      t = t.replace(weekday[0], " ");
    }

    /* ---- time ---- */
    const at = t.match(/\b(?:at\s+)?(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/);
    const at24 = t.match(/\bat\s+(\d{1,2}):(\d{2})\b/);
    const atBare = t.match(/\bat\s+(\d{1,2})\b(?!\s*(?:am|pm|:))/);
    const words = { morning: 9, noon: 12, afternoon: 14, evening: 19, midnight: 0 };
    if (at) {
      let h = Number(at[1]) % 12;
      if (at[3] === "pm") h += 12;
      date.setHours(h, Number(at[2] || 0), 0, 0);
      timeGiven = true; t = t.replace(at[0], " ");
    } else if (at24) {
      date.setHours(Number(at24[1]), Number(at24[2]), 0, 0);
      timeGiven = true; t = t.replace(at24[0], " ");
    } else if (/\bnoon\b/.test(t)) {
      date.setHours(12, 0, 0, 0); timeGiven = true; t = t.replace(/\bnoon\b/g, " ");
    } else if (/\bmidnight\b/.test(t)) {
      date.setHours(0, 0, 0, 0); timeGiven = true; t = t.replace(/\bmidnight\b/g, " ");
    } else if (/\bmorning\b/.test(t)) {
      date.setHours(words.morning, 0, 0, 0); timeGiven = true; t = t.replace(/\bmorning\b/g, " ");
    } else if (/\bafternoon\b/.test(t)) {
      date.setHours(words.afternoon, 0, 0, 0); timeGiven = true; t = t.replace(/\bafternoon\b/g, " ");
    } else if (/\bevening\b/.test(t)) {
      date.setHours(words.evening, 0, 0, 0); timeGiven = true; t = t.replace(/\bevening\b/g, " ");
    } else if (atBare) {
      date.setHours(Number(atBare[1]), 0, 0, 0);
      timeGiven = true; t = t.replace(atBare[0], " ");
    }

    /* ---- priority ---- */
    if (/\burgent\b|\basap\b|\bhigh priority\b|\bvery important\b|\bcritical\b/.test(t)) {
      priority = "high"; t = t.replace(/\burgent\b|\basap\b|\bhigh priority\b|\bvery important\b|\bcritical\b/g, " ");
    } else if (/\blow priority\b|\bwhenever\b|\bnot urgent\b|\bsome time\b/.test(t)) {
      priority = "low"; t = t.replace(/\blow priority\b|\bwhenever\b|\bnot urgent\b|\bsome time\b/g, " ");
    } else if (/\bimportant\b/.test(t)) {
      priority = "high"; t = t.replace(/\bimportant\b/g, " ");
    }

    /* ---- category ---- */
    const catRules = [
      ["School", /\b(study|studies|revision|revise|homework|exam|test|assignment|project|class|lecture|school|university|college|maths|math|science|english|history|essay|course|seminar|lab|thesis|dissertation)\b/],
      ["Work", /\b(work|meeting|standup|stand-up|call|client|email|report|deadline|sprint|presentation|deck|interview|website|deploy|release|invoice|office|boss|colleague|review|sync|proposal|pitch)\b/],
      ["Important", /\b(bill|payment|pay|tax|insurance|passport|doctor|dentist|appointment|renew|deadline|legal|bank|visa|prescription|medicine)\b/],
      ["Personal", /\b(gym|workout|run|shopping|grocery|groceries|buy|pick up|pickup|clean|laundry|cook|dinner|family|friend|birthday|call mom|call dad|travel|flight|book|read|meditate|walk|water|plants|car|repair)\b/]
    ];
    for (const [cat, re] of catRules) {
      if (re.test(t)) { category = cat; break; }
    }
    if (!category && /\bimportant\b/.test(raw.toLowerCase())) category = "Important";

    /* ---- title ---- */
    let title = raw
      .replace(/^(hey|hi|hello|ok|okay|please)[,\s]+/i, "")
      .replace(/^remind\s+me\s+to\s+/i, "")
      .replace(/^remind\s+me\s+(?:about\s+|that\s+)?/i, "")
      .replace(/^remember\s+to\s+/i, "")
      .replace(/^i\s+need\s+to\s+/i, "")
      .replace(/^don'?t\s+let\s+me\s+forget\s+(?:to\s+)?/i, "");

    // Strip the phrases we consumed from the working copy.
    let cleaned = raw.toLowerCase();
    const drop = [
      /\btomorrow\b/g, /\btoday\b/g, /\btonight\b/g, /\bthis evening\b/g, /\bnext week\b/g,
      /\bevery\s+\d+\s*(day|days|week|weeks|month|months)\b/g,
      /\bevery\s+(sunday|monday|tuesday|wednesday|thursday|friday|saturday|sun|mon|tue|tues|wed|thu|thur|thurs|fri|sat)\b/g,
      /\bevery\s*(day|week|month)\b/g, /\bdaily\b/g, /\bweekly\b/g, /\bmonthly\b/g,
      /\bin\s+\d+\s*(day|days|week|weeks|month|months)\b/g,
      /\b(?:at\s+)?\d{1,2}(?::\d{2})?\s*(am|pm)\b/g, /\bat\s+\d{1,2}:\d{2}\b/g, /\bat\s+\d{1,2}\b/g,
      /\bnoon\b/g, /\bmidnight\b/g, /\bmorning\b/g, /\bafternoon\b/g, /\bevening\b/g,
      /\burgent\b/g, /\basap\b/g, /\bhigh priority\b/g, /\blow priority\b/g, /\bvery important\b/g,
      /\bcritical\b/g, /\bimportant\b/g, /\bwhenever\b/g, /\bnot urgent\b/g,
      /\b(january|february|march|april|may|june|july|august|september|october|november|december|jan|feb|mar|apr|jun|jul|aug|sep|sept|oct|nov|dec)\s+\d{1,2}(?:st|nd|rd|th)?\b/g,
      /\b\d{1,2}(?:st|nd|rd|th)?\s+(?:of\s+)?(january|february|march|april|may|june|july|august|september|october|november|december|jan|feb|mar|apr|jun|jul|aug|sep|sept|oct|nov|dec)\b/g,
      /\b(on|this|next)\s+(sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/g
    ];
    drop.forEach(re => { cleaned = cleaned.replace(re, " "); });

    const fromClean = raw.split("").filter((_, i) => true).join(""); // keep original casing available
    // Rebuild title with original casing by removing matched spans from the raw string.
    title = stripPhrases(raw);
    title = title.replace(/^(remind me to|remind me|remember to|i need to|please)\s+/i, "")
      .replace(/\s{2,}/g, " ")
      .replace(/[\s,.;:]+$/, "")
      .trim();

    if (!title) title = raw.trim();

    // Normalise capitalisation for a title feel.
    title = title.charAt(0).toUpperCase() + title.slice(1);

    if (!timeGiven) {
      // A sensible default that respects the user's default duration preference.
      const def = new Date(now); def.setMinutes(def.getMinutes() + Number(store.prefs.duration || 30));
      date.setHours(def.getHours(), Math.round(def.getMinutes() / 5) * 5, 0, 0);
    }

    if (!category) category = guessCategory(title);

    return {
      ok: title.length > 0,
      title,
      date: ymd(date),
      time: `${pad(date.getHours())}:${pad(date.getMinutes())}`,
      repeat, custom,
      priority: priority || (category === "Important" ? "high" : "medium"),
      category,
      notify: true
    };
  }
};

function weekdayIndex(name) {
  const map = { sun: 0, sunday: 0, mon: 1, monday: 1, tue: 2, tues: 2, tuesday: 2, wed: 3, wednesday: 3, thu: 4, thur: 4, thurs: 4, thursday: 4, fri: 5, friday: 5, sat: 6, saturday: 6 };
  return map[String(name).toLowerCase()] ?? 0;
}
function guessCategory(title) {
  const t = String(title).toLowerCase();
  if (/(study|exam|homework|assignment|class|lecture|revision|maths|science|essay)/.test(t)) return "School";
  if (/(work|meeting|client|report|email|website|deploy|invoice|presentation)/.test(t)) return "Work";
  if (/(bill|pay|tax|insurance|doctor|dentist|renew|deadline)/.test(t)) return "Important";
  if (/(gym|buy|grocery|clean|call|family|friend|cook|walk|read|travel)/.test(t)) return "Personal";
  return "Other";
}
/** Remove recognised scheduling phrases from the raw string, preserving casing. */
function stripPhrases(raw) {
  const patterns = [
    /\btomorrow\b/gi, /\btoday\b/gi, /\btonight\b/gi, /\bthis evening\b/gi, /\bnext week\b/gi,
    /\bevery\s+\d+\s*(?:day|days|week|weeks|month|months)\b/gi,
    /\bevery\s+(?:sunday|monday|tuesday|wednesday|thursday|friday|saturday|sun|mon|tue|tues|wed|thu|thur|thurs|fri|sat)\b/gi,
    /\bevery\s*(?:day|week|month)\b/gi, /\bdaily\b/gi, /\bweekly\b/gi, /\bmonthly\b/gi,
    /\bin\s+\d+\s*(?:day|days|week|weeks|month|months)\b/gi,
    /\b(?:at\s+)?\d{1,2}(?::\d{2})?\s*(?:am|pm)\b/gi,
    /\bat\s+\d{1,2}:\d{2}\b/gi, /\bat\s+\d{1,2}\b/gi,
    /\bnoon\b/gi, /\bmidnight\b/gi, /\bmorning\b/gi, /\bafternoon\b/gi, /\bevening\b/gi,
    /\burgent\b/gi, /\basap\b/gi, /\bhigh priority\b/gi, /\blow priority\b/gi,
    /\bvery important\b/gi, /\bcritical\b/gi, /\bimportant\b/gi, /\bwhenever\b/gi, /\bnot urgent\b/gi,
    /\b(?:january|february|march|april|may|june|july|august|september|october|november|december|jan|feb|mar|apr|jun|jul|aug|sep|sept|oct|nov|dec)\s+\d{1,2}(?:st|nd|rd|th)?\b/gi,
    /\b\d{1,2}(?:st|nd|rd|th)?\s+(?:of\s+)?(?:january|february|march|april|may|june|july|august|september|october|november|december|jan|feb|mar|apr|jun|jul|aug|sep|sept|oct|nov|dec)\b/gi,
    /\b(?:on|this|next)\s+(?:sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/gi,
    /\bremind me to\b/gi, /\bremind me\b/gi, /\bremember to\b/gi
  ];
  let s = raw;
  patterns.forEach(p => { s = s.replace(p, " "); });
  return s.replace(/\s{2,}/g, " ").replace(/^[,\s]+/, "").trim();
}

/* ------------------------------------------------------------------ ui */
const ui = {
  toast(message, type = "ok") {
    const wrap = $("#toasts");
    const el = document.createElement("div");
    el.className = `toast ${type}`;
    const icon = type === "warn" ? ICON.alert : type === "info" ? ICON.clock : ICON.check;
    el.innerHTML = `${icon}<span>${esc(message)}</span>`;
    wrap.appendChild(el);
    setTimeout(() => {
      el.classList.add("out");
      setTimeout(() => el.remove(), 240);
    }, 3200);
  },

  confirm({ title, body, confirmLabel = "Confirm", danger = false }) {
    return new Promise(resolve => {
      const root = $("#modalRoot");
      const prev = document.activeElement;
      const overlay = document.createElement("div");
      overlay.className = "overlay";
      overlay.innerHTML = `
        <div class="modal confirm" role="alertdialog" aria-modal="true" aria-labelledby="cfTitle">
          <div class="modal-body">
            <h2 id="cfTitle">${esc(title)}</h2>
            ${body ? `<p class="t-body muted">${esc(body)}</p>` : ""}
          </div>
          <div class="modal-foot">
            <button class="btn btn-ghost" data-act="cancel">Cancel</button>
            <button class="btn ${danger ? "btn-danger" : "btn-primary"}" data-act="ok">${esc(confirmLabel)}</button>
          </div>
        </div>`;
      root.appendChild(overlay);

      const close = val => {
        overlay.remove();
        if (prev && prev.focus) prev.focus();
        resolve(val);
      };
      overlay.addEventListener("click", e => {
        if (e.target === overlay) return close(false);
        const b = e.target.closest("[data-act]");
        if (!b) return close(b.dataset.act === "ok");
      });
      const onKey = e => {
        if (e.key === "Escape") { document.removeEventListener("keydown", onKey); close(false); }
        if (e.key === "Enter") { document.removeEventListener("keydown", onKey); close(true); }
      };
      document.addEventListener("keydown", onKey);
      setTimeout(() => $("[data-act='ok']", overlay)?.focus(), 30);
    });
  },

  openModal(html, { onMount, wide = false } = {}) {
    const root = $("#modalRoot");
    const overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.innerHTML = `<div class="modal ${wide ? "wide" : ""}" role="dialog" aria-modal="true">${html}</div>`;
    root.appendChild(overlay);

    const close = () => {
      overlay.remove();
      document.removeEventListener("keydown", onKey);
    };
    const onKey = e => {
      if (e.key === "Escape") { e.preventDefault(); close(); }
    };
    document.addEventListener("keydown", onKey);
    overlay.addEventListener("click", e => {
      if (e.target === overlay) close();
      const closer = e.target.closest("[data-close]");
      if (closer) close();
    });
    if (onMount) onMount(overlay.querySelector(".modal"), close);
    return close;
  }
};

    $$(".bar i, .pulse-bar i").forEach(el => {
      const w = el.dataset.w + "%";
      if (reduceMotion()) el.style.width = w;
      else requestAnimationFrame(() => { el.style.width = w; });
    });
  });

function buildRail(all, now) {
  const todays = all
    .filter(r => sched.onDate(r, now))
    .map(r => ({ r, d: occurrenceOn(r, now) }))
    .filter(x => x.d)
    .sort((a, b) => a.d - b.d);

  let startH = 6, endH = 22;
  if (todays.length) {
    startH = Math.min(startH, todays[0].d.getHours());
    endH = Math.max(endH, todays[todays.length - 1].d.getHours() + 1);
  }
  startH = clamp(startH, 0, 23);
  endH = clamp(endH, startH + 1, 24);

  const rows = [];
  for (let h = startH; h < endH; h++) {
    const inHour = todays.filter(x => x.d.getHours() === h);
    const isNowHour = now.getHours() === h;
    const nowTop = isNowHour ? (now.getMinutes() / 60) * 100 : 0;
    rows.push(`
      <div class="rail-row {inHour.length ? "has" : ""}">
        ${isNowHour ? `<div class="rail-now" style="top:${nowTop}%"><span>Now</span></div>` : ""}
        <div class="rail-hour mono muted">${esc(format.time(`${pad(h)}:00`))}</div>
        <div class="rail-tick"><i></i></div>
        <div class="rail-slot">
          ${inHour.length
      ? inHour.map(({ r }) => `
              <button class="rail-node ${r.completed ? "is-done" : ""}" data-act="edit" data-id="${r.id}">
                <span class="ndot" style="background:${r.completed ? "var(--green)" : CAT_COLOR[r.category]}"></span>
                <span class="ntitle">${esc(r.title)}</span>
                <span class="ntime t-caption">${esc(format.time(r.time))}</span>
              </button>`).join("")
      : `<div class="rail-blank"></div>`}
        </div>
      </div>`);
  }

  return `<div class="rail-body"><div class="rail-line"></div>${rows.join("")}</div>`;
}

function occurrenceOn(r, dateObj) {
  const occ = sched.occurrences(r, startOfDay(dateObj), new Date(startOfDay(dateObj).getTime() + 86399999));
  return occ[0] || null;
}

function animateNumber(el, to) {
  if (!el) return;
  if (reduceMotion()) { el.textContent = String(to); return; }
  const from = Number(el.textContent) || 0;
  const dur = 520;
  const t0 = performance.now();
  const step = t => {
    const p = clamp((t - t0) / dur, 0, 1);
    const e = 1 - Math.pow(1 - p, 3);
    el.textContent = String(Math.round(from + (to - from) * e));
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/* ---- REMINDERS ---- */
function renderReminders() {
  const { query, filter, sort } = store.ui;
  let list = store.reminders.slice();

  if (query.trim()) {
    const q = query.trim().toLowerCase();
    list = list.filter(r =>
      r.title.toLowerCase().includes(q) ||
      (r.notes || "").toLowerCase().includes(q) ||
      r.category.toLowerCase().includes(q));
  }

  const now = new Date();
  if (filter === "upcoming") list = list.filter(r => !r.completed && sched.effective(r) >= now);
  else if (filter === "overdue") list = list.filter(r => sched.isOverdue(r));
  else if (filter === "completed") list = list.filter(r => r.completed);
  else if (CATS.includes(filter)) list = list.filter(r => r.category === filter);
  else if (filter.startsWith("prio:")) list = list.filter(r => r.priority === filter.slice(5));

  if (sort === "time") list.sort((a, b) => sched.effective(a) - sched.effective(b));
  else if (sort === "priority") list.sort((a, b) => PRIO_ORDER[a.priority] - PRIO_ORDER[b.priority] || sched.effective(a) - sched.effective(b));
  else if (sort === "date") list.sort((a, b) => parseYmd(a.date) - parseYmd(b.date));
  else if (sort === "title") list.sort((a, b) => a.title.localeCompare(b.title));

  const chips = [
    ["all", "All"], ["upcoming", "Upcoming"], ["overdue", "Overdue"], ["completed", "Completed"],
    ...CATS.map(c => [c, c]),
    ["prio:high", "High priority"]
  ];

  view.innerHTML = `
    <div class="view-in">
      <div class="section-head">
        <div>
          <span class="t-label">Reminder stack</span>
          <h1 class="t-heading">Everything on your list</h1>
        </div>
        <button class="btn btn-primary inline" data-act="add">${ICON.plus} Add Reminder</button>
      </div>

      <div class="toolbar">
        <div class="search-wrap">
          ${ICON.search}
          <input class="input" id="searchInput" type="search" placeholder="Search reminders  ( / )" value="${esc(query)}" aria-label="Search reminders">
        </div>
        <select class="input" id="sortSelect" aria-label="Sort reminders" style="width:190px;flex:0 0 auto">
          <option value="time" ${sort === "time" ? "selected" : ""}>Sort: Time</option>
          <option value="priority" ${sort === "priority" ? "selected" : ""}>Sort: Priority</option>
          <option value="date" ${sort === "date" ? "selected" : ""}>Sort: Date</option>
          <option value="title" ${sort === "title" ? "selected" : ""}>Sort: Title</option>
        </select>
      </div>

      <div class="toolbar" style="margin-bottom:var(--s5)">
        <div class="filters" role="tablist" aria-label="Filter reminders">
          ${chips.map(([k, label]) => `
            <button class="filter-chip ${filter === k ? "active" : ""}" data-filter="${k}" role="tab" aria-selected="${filter === k}">${label}</button>`).join("")}
        </div>
      </div>

      <p class="result-count">${list.length} reminder${list.length === 1 ? "" : "s"}${query.trim() ? ` matching “${esc(query.trim())}”` : ""}</p>

      ${list.length
      ? `<div class="list">${list.map(r => reminderCard(r)).join("")}</div>`
      : emptyState({
        icon: ICON.inbox,
        title: query.trim() ? "No matching reminders" : "No reminders in this view",
        body: query.trim() ? "Try a different search term, or clear the filters to see everything." : "Create one and it will appear in your stack straight away.",
        action: "add", actionLabel: "Add reminder"
      })}
    </div>`;

  const s = $("#searchInput");
  if (s) {
    let t;
    s.addEventListener("input", e => {
      clearTimeout(t);
      const val = e.target.value;
      t = setTimeout(() => {
        store.ui.query = val;
        render();
        const ns = $("#searchInput");
        if (ns) { ns.focus(); ns.setSelectionRange(val.length, val.length); }
      }, 180);
    });
  }
  const sortSel = $("#sortSelect");
  if (sortSel) sortSel.addEventListener("change", e => { store.ui.sort = e.target.value; render(); });
}

/* ---- CALENDAR ---- */
function renderCalendar() {
  const today = new Date();
  const base = store.ui.calMonth ? parseYmd(store.ui.calMonth) : new Date(today.getFullYear(), today.getMonth(), 1);
  const year = base.getFullYear(), month = base.getMonth();
  const first = new Date(year, month, 1);
  const startOffset = (first.getDay() + 6) % 7; // Monday-first
  const gridStart = new Date(year, month, 1 - startOffset);
  const selKey = store.ui.calDay || ymd(today);

  const cells = [];
  for (let i = 0; i < 42; i++) {
    const d = new Date(gridStart);
    d.setDate(gridStart.getDate() + i);
    const key = ymd(d);
    const dayRems = store.reminders.filter(r => sched.onDate(r, d));
    cells.push({ d, key, out: d.getMonth() !== month, rems: dayRems });
  }

  const selectedDate = parseYmd(selKey);
  const dayList = store.reminders
    .filter(r => sched.onDate(r, selectedDate))
    .sort((a, b) => occurrenceOn(a, selectedDate) - occurrenceOn(b, selectedDate));

  view.innerHTML = `
    <div class="view-in">
      <div class="section-head">
        <div>
          <span class="t-label">Calendar</span>
          <h1 class="t-heading">Month view</h1>
        </div>
        <button class="btn btn-primary inline" data-act="add-on-date">${ICON.plus} Add on ${esc(format.shortDate(selectedDate))}</button>
      </div>

      <div class="cal-grid-wrap">
        <div class="card" style="padding:var(--s6)">
          <div class="cal-head">
            <button class="icon-btn" data-act="cal-prev" aria-label="Previous month">${ICON.chevL}</button>
            <h2 class="cal-title">${MONTHS[month]} ${year}</h2>
            <button class="icon-btn" data-act="cal-next" aria-label="Next month">${ICON.chevR}</button>
            <div style="flex:1"></div>
            <button class="btn btn-ghost btn-sm inline" data-act="cal-today">Today</button>
          </div>

          <div class="cal-dow">${["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].map(d => `<span>${d}</span>`).join("")}</div>
          <div class="cal-days">
            ${cells.map(c => {
    const isToday = c.key === ymd(today);
    const isSel = c.key === selKey;
    const dots = c.rems.slice(0, 4).map(r => `<span class="cal-dot" style="background:${r.completed ? "var(--green)" : CAT_COLOR[r.category]}"></span>`).join("");
    return `
                <button class="cal-day ${c.out ? "out" : ""} ${isToday ? "today" : ""} ${isSel ? "sel" : ""}"
                        data-act="cal-day" data-day="${c.key}"
                        aria-label="${esc(format.fullDate(c.d))}, ${c.rems.length} reminders">
                  <span class="dnum">${c.d.getDate()}</span>
                  <span class="cal-dots">${dots}${c.rems.length > 4 ? `<span class="cal-more">+${c.rems.length - 4}</span>` : ""}</span>
                </button>`;
  }).join("")}
          </div>
        </div>

        <div class="day-panel">
          <div class="card" style="padding:var(--s6)">
            <span class="t-label muted">Selected day</span>
            <h2 class="t-heading" style="margin:8px 0 4px">${esc(format.fullDate(selectedDate))}</h2>
            <p class="t-caption" style="margin-bottom:var(--s5)">${dayList.length} reminder${dayList.length === 1 ? "" : "s"} scheduled</p>

            ${dayList.length
      ? `<div class="list">${dayList.map(r => reminderCard(r)).join("")}</div>`
      : emptyState({
        icon: ICON.calendar,
        title: "No reminders for this day",
        body: "Create one directly from this date — it will be pre-filled for you.",
        action: "add-on-date", actionLabel: "Add reminder"
      })}
          </div>
        </div>
      </div>
    </div>`;
}
